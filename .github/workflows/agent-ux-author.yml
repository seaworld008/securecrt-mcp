name: Agent UX source validation
on:
  push:
    branches: [feat/agent-first-command-ux]
permissions:
  contents: read
jobs:
  author:
    if: github.ref == 'refs/heads/feat/agent-first-command-ux'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agent-first-command-ux
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build unchanged baseline
        run: cargo build --locked
      - name: Verify high-level test is RED on baseline
        run: |
          if python tests/ux_smoke.py target/debug/securecrt-mcp > /tmp/ux-red.log 2>&1; then
            cat /tmp/ux-red.log
            exit 1
          fi
          cat /tmp/ux-red.log
          grep -q 'new install should delegate command-risk decisions' /tmp/ux-red.log
      - name: Apply reviewed source transformations
        run: python .agent-ux-patch.py
      - run: cargo fmt --all
      - run: cargo check --locked --all-targets --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo build --locked
      - run: python -m unittest discover -s tests -v
      - run: python tests/mcp_smoke.py target/debug/securecrt-mcp
      - run: python tests/ux_smoke.py target/debug/securecrt-mcp
      - name: Commit validated sources to feature branch only
        run: |
          test "$(git branch --show-current)" = feat/agent-first-command-ux
          rm .agent-ux-patch.py .github/workflows/agent-ux-author.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src bridge tests Cargo.toml Cargo.lock .agent-ux-patch.py .github/workflows/agent-ux-author.yml
          git commit -m 'feat: enable one-call agent UX and preserve explicit delivery evidence'
          git push origin HEAD:refs/heads/feat/agent-first-command-ux
