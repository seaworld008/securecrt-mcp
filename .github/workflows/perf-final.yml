name: Persistent terminal release readiness
on:
  push:
    branches: [feat/persistent-terminal-performance]
permissions:
  contents: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/persistent-terminal-performance
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .perf-finalize.py
      - run: cargo fmt --all
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo build --locked
      - run: python -m unittest discover -s tests -v
      - run: python tests/mcp_smoke.py target/debug/securecrt-mcp
      - run: python tests/ux_smoke.py target/debug/securecrt-mcp
      - run: python tests/review_smoke.py target/debug/securecrt-mcp
      - run: python tests/performance_smoke.py target/debug/securecrt-mcp
      - run: python tests/persistent_fault_smoke.py target/debug/securecrt-mcp
      - run: python tests/daemon_smoke.py target/debug/securecrt-mcp
      - run: python tests/package_smoke.py target/debug/securecrt-mcp review-linux
      - run: python scripts/validate_repository.py
      - name: Commit verified final source to feature branch only
        run: |
          test "$(git branch --show-current)" = feat/persistent-terminal-performance
          rm .perf-finalize.py .github/workflows/perf-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src bridge clients tests scripts docs README* CHANGELOG.md .perf-finalize.py .github/workflows/perf-final.yml
          git commit -m 'fix: finalize persistent terminal lifecycle, critical scope and unified clients'
          git push origin HEAD:refs/heads/feat/persistent-terminal-performance
