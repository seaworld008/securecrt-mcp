# Temporary branch-only normalization. Removed before the PR is merged.
name: Prepare preview source
on:
  push:
    branches: [feat/reliable-terminal-lifecycle]
    paths: [.github/workflows/prepare-preview.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'seaworld008/securecrt-mcp' && github.ref == 'refs/heads/feat/reliable-terminal-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reliable-terminal-lifecycle
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify transferred source against local SHA-256 evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          # Correct two transfer-only typos, then require byte-for-byte source identity.
          path = Path('src/policy.rs')
          path.write_text(path.read_text().replace('(restart|stop|stop)', '(restart|stop|start)'))
          path = Path('src/execution.rs')
          path.write_text(path.read_text().replace('b"-_ ."', 'b"-_."'))
          expected = {
            'bridge/securecrt_bridge.py': '69adaef756c6270993071d6335357e3fdaee843ed26bc44ab52e413df495afb7',
            'src/audit.rs': '890c6d4eae8952107d23a261e823ed5e344626865a0a914743eb7b9db0c05599',
            'src/bridge.rs': '2dbfc8f9baf9e53ec3c96bf8aee72521cfcb434e51fc93dc481988cd0426f90c',
            'src/config.rs': '1844bfa804b3c992d738e2a09cfb56c8e10d27d46a7f81569c7fb5b3825c280b',
            'src/execution.rs': 'e8ad72a2d59f4a3aac6dffc15691b79eab91c78eee8ed52430421bc9ebac4a97',
            'src/main.rs': 'd86845bf8f360c15a1f1ac1b7d114c626f41499fe4e3f34878ea1081e2f21559',
            'src/model.rs': '3a09e15a417f3f02aa64d498b64a0db7a9bab7ca1ce75a62dce29d484b200197',
            'src/policy.rs': 'd133d81429b2b860c1c55664aa5288c6d935672d842b9e0fb891164c7bdbb823',
            'src/regression.rs': 'dbd221ff703b41bdec782e44399ae7c6c2b9138c336acc601339dceb7cbea2b6',
            'src/server.rs': '7c783a3957b825cc00a9897b36f2d14d6d7d6a2397570eb1578dcb31e082b623',
            'tests/mcp_smoke.py': '2fd8340e6ad258373889bb1077920a9cded055adc7d79292439e4e10f34d7c18',
            'tests/test_bridge.py': 'f2afad42a30c61593deabf944899aca99b5f6e04724090eb024949d9d38a112d'
          }
          bad = [name for name, digest in expected.items() if hashlib.sha256(Path(name).read_bytes()).hexdigest() != digest]
          assert not bad, 'Source transfer mismatch: ' + ', '.join(bad)
          print('Verified all transferred implementation/test files')
          PY
      - run: python -m unittest discover -s tests -v
      - run: cargo fmt --all
      - run: cargo generate-lockfile
      - name: Commit normalized source and genuine dependency lockfile to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m 'chore: normalize Rust sources and lock preview dependencies'
            git push origin HEAD:feat/reliable-terminal-lifecycle
          fi
      - run: cargo check --locked --all-targets --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo build --locked
      - run: python tests/mcp_smoke.py target/debug/securecrt-mcp
