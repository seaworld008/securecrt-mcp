name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  rust:
    name: Rust / Node (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo build --locked
      - name: Node compiled MCP, safety, uncertainty, IPC, daemon, package and native Windows contracts
        shell: bash
        run: |
          binary=target/debug/securecrt-mcp
          if [ "${{ runner.os }}" = Windows ]; then binary="$binary.exe"; fi
          node tests/run_node_tests.js "$binary"
          node tests/performance_smoke.js "$binary" --output performance-ci.json
      - run: node scripts/validate_repository.js
      - name: Preserve tested native bundle for desktop acceptance
        uses: actions/upload-artifact@v7
        with:
          name: native-test-bundle-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: connector-performance-${{ runner.os }}-${{ runner.arch }}
          path: performance-ci.json
          if-no-files-found: ignore
  mac-adapter:
    name: Mac native SDK contract
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build --locked
      - name: Node controller of actual Mac-only Python SDK adapter and native redraw contracts
        run: node tests/mac_adapter_contract.js target/debug/securecrt-mcp
