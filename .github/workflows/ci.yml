name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo build --locked
      - name: Live MCP stdio against fake bridge
        shell: bash
        run: |
          binary=target/debug/securecrt-mcp
          if [ "${{ runner.os }}" = Windows ]; then binary="$binary.exe"; fi
          python tests/mcp_smoke.py "$binary"
          python tests/package_smoke.py "$binary" "ci-${{ runner.os }}-${{ runner.arch }}"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_repository.py
  python-compatibility:
    name: Adapter syntax / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m py_compile bridge/securecrt_bridge.py
      - run: python -m unittest discover -s tests -v
