name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<9'
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo build --locked
      - name: MCP compatibility and recovery
        shell: bash
        run: |
          binary=target/debug/securecrt-mcp
          if [ "${{ runner.os }}" = Windows ]; then binary="$binary.exe"; fi
          python tests/mcp_smoke.py "$binary"
          python tests/ux_smoke.py "$binary"
          python tests/review_smoke.py "$binary"
      - name: Persistent transport, streaming, multi-tab and daemon clients
        shell: bash
        run: |
          binary=target/debug/securecrt-mcp
          if [ "${{ runner.os }}" = Windows ]; then binary="$binary.exe"; fi
          python tests/performance_smoke.py "$binary" --output performance-ci.json
          python tests/persistent_fault_smoke.py "$binary"
          python tests/daemon_smoke.py "$binary"
          python tests/package_smoke.py "$binary" "ci-${{ runner.os }}-${{ runner.arch }}"
      - name: Confirmed completion redraw, batch boundaries and no replay
        shell: bash
        run: |
          binary=target/debug/securecrt-mcp
          if [ "${{ runner.os }}" = Windows ]; then binary="$binary.exe"; fi
          python tests/prompt_readiness_smoke.py "$binary"
      - run: python -m pytest -q tests
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_repository.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connector-performance-${{ runner.os }}-${{ runner.arch }}
          path: performance-ci.json
          if-no-files-found: ignore
  adapter:
    name: Adapter syntax / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.12']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m py_compile bridge/securecrt_bridge.py
      - run: python -m unittest discover -s tests -v
