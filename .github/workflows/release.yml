name: Release
on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: securecrt-release
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      tag: ${{ steps.gate.outputs.tag }}
      source_sha: ${{ steps.gate.outputs.source_sha }}
      notes: ${{ steps.gate.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pin the tested commit and honor an explicit release request
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: node scripts/release_gate.js
  build:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: securecrt-mcp
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: securecrt-mcp.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: securecrt-mcp
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: securecrt-mcp
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: "3.12"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - name: Build the debug binary required by compiled integration tests
        run: cargo build --locked
      - run: node scripts/validate_repository.js
      - run: cargo build --locked --release --target-dir target-latest-test
      - name: MCP and readiness gates on the native runner architecture
        shell: bash
        run: |
          binary=target-latest-test/release/securecrt-mcp
          if [ "${{ runner.os }}" = Windows ]; then binary="$binary.exe"; fi
          node tests/run_node_tests.js "$binary"
          if [ "${{ runner.os }}" = macOS ]; then node tests/mac_adapter_contract.js "$binary"; fi
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - run: node scripts/package_release.js target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*-${{ matrix.target }}.zip
            dist/*-${{ matrix.target }}.zip.sha256
          if-no-files-found: error
  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify four archives and publish the selected source once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          NOTES: ${{ needs.prepare.outputs.notes }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [ "$EVENT" = workflow_run ]; then
            test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')" = "$SOURCE_SHA"
          fi
          cd dist
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 4
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 4
          cat *.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          cp "../$NOTES" RELEASE_NOTES.md
          printf '\nSource commit: `%s`\n' "$SOURCE_SHA" >> RELEASE_NOTES.md
          if [[ "$TAG" == *-* ]]; then
            gh release create "$TAG" --target "$SOURCE_SHA" --prerelease --latest=false \
              --title "securecrt-mcp $TAG — preview" \
              --notes-file RELEASE_NOTES.md *.zip SHA256SUMS
          else
            gh release create "$TAG" --target "$SOURCE_SHA" --latest \
              --title "securecrt-mcp $TAG — production release" \
              --notes-file RELEASE_NOTES.md *.zip SHA256SUMS
          fi
          git fetch --no-tags origin "refs/tags/$TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$SOURCE_SHA"
