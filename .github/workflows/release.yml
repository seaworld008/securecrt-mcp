name: Release preview
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: securecrt-mcp
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: securecrt-mcp.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: securecrt-mcp
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: securecrt-mcp
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tag/version gate
        shell: bash
        run: python -c 'import os,tomllib; assert os.environ["GITHUB_REF_NAME"] == "v"+tomllib.load(open("Cargo.toml","rb"))["package"]["version"]'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_repository.py
      - run: cargo build --locked
      - name: MCP transport gate on runner architecture
        shell: bash
        run: |
          binary=target/debug/securecrt-mcp
          if [ "${{ runner.os }}" = Windows ]; then binary="$binary.exe"; fi
          python tests/mcp_smoke.py "$binary"
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - run: python scripts/package_release.py target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify archives and create preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release create "$TAG" --verify-tag --prerelease --generate-notes *.zip SHA256SUMS
