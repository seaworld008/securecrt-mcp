name: Persistent terminal review and comparative benchmark
on:
  push:
    branches: [feat/persistent-terminal-performance]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/persistent-terminal-performance
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo build --locked
      - name: Prove daemon workflow regression before integration
        run: |
          if python tests/daemon_smoke.py target/debug/securecrt-mcp > /tmp/daemon-red.log 2>&1; then exit 1; fi
          cat /tmp/daemon-red.log
          grep -q 'daemon command missing' /tmp/daemon-red.log
      - run: python .perf-review.py
      - run: cargo fmt --all
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo build --locked
      - run: python -m unittest discover -s tests -v
      - run: python tests/performance_smoke.py target/debug/securecrt-mcp --output /tmp/persistent.json
      - run: python tests/daemon_smoke.py target/debug/securecrt-mcp
      - run: python tests/mcp_smoke.py target/debug/securecrt-mcp
      - run: python tests/ux_smoke.py target/debug/securecrt-mcp
      - run: python tests/review_smoke.py target/debug/securecrt-mcp
      - name: Build immutable previous release for same-harness baseline
        run: |
          mkdir /tmp/securecrt-baseline
          git archive 9e94b4c4acaeb5a0c9cf4f6d14d2597b24e06214 | tar -x -C /tmp/securecrt-baseline
          CARGO_TARGET_DIR="$PWD/target-baseline" cargo build --locked --manifest-path /tmp/securecrt-baseline/Cargo.toml
          python tests/performance_smoke.py target-baseline/debug/securecrt-mcp --adapter /tmp/securecrt-baseline/bridge/securecrt_bridge.py --baseline --output /tmp/baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connector-comparative-performance
          path: |
            /tmp/persistent.json
            /tmp/baseline.json
      - name: Commit validated sources and inspectable benchmark evidence on feature only
        run: |
          test "$(git branch --show-current)" = feat/persistent-terminal-performance
          mkdir -p docs/benchmarks
          cp /tmp/persistent.json docs/benchmarks/persistent.json
          cp /tmp/baseline.json docs/benchmarks/baseline.json
          rm .perf-review.py .github/workflows/perf-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src bridge clients tests docs/benchmarks .perf-review.py .github/workflows/perf-integration.yml
          git commit -m 'fix: native ownership, buffered draining and persistent CLI engine lifecycle'
          git push origin HEAD:refs/heads/feat/persistent-terminal-performance
