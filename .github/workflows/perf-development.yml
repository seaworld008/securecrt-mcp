name: Persistent terminal implementation validation
on:
  push:
    branches: [feat/persistent-terminal-performance]
permissions:
  contents: read
jobs:
  implementation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/persistent-terminal-performance
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .perf-apply.py
      - run: python -m py_compile bridge/securecrt_bridge.py
      - run: python -m unittest discover -s tests -v
      - run: cargo fmt --all
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo build --locked
      - run: python tests/mcp_smoke.py target/debug/securecrt-mcp
      - run: python tests/ux_smoke.py target/debug/securecrt-mcp
      - run: python tests/review_smoke.py target/debug/securecrt-mcp
      - name: Commit validated implementation on feature branch only
        run: |
          test "$(git branch --show-current)" = feat/persistent-terminal-performance
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .perf-apply.py .perf-native.py .perf-tools.rs .github/workflows/perf-development.yml
          git add src bridge tests Cargo.toml Cargo.lock .perf-apply.py .perf-native.py .perf-tools.rs .github/workflows/perf-development.yml
          git commit -m 'feat: persistent transport, batched native reads and per-session execution'
          git push origin HEAD:refs/heads/feat/persistent-terminal-performance
