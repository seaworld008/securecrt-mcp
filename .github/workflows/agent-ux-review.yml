name: Agent UX final review
on:
  push:
    branches: [feat/agent-first-command-ux]
permissions:
  contents: read
jobs:
  review:
    if: github.ref == 'refs/heads/feat/agent-first-command-ux'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agent-first-command-ux
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo build --locked
      - name: Prove explicit recovery regression before fix
        run: |
          if python tests/review_smoke.py target/debug/securecrt-mcp > /tmp/review-red.log 2>&1; then
            cat /tmp/review-red.log
            exit 1
          fi
          cat /tmp/review-red.log
          grep -q 'acknowledged job still requests acknowledgement' /tmp/review-red.log
      - run: python .agent-ux-review.py
      - run: cargo fmt --all
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo build --locked
      - run: python -m unittest discover -s tests -v
      - run: python tests/mcp_smoke.py target/debug/securecrt-mcp
      - run: python tests/ux_smoke.py target/debug/securecrt-mcp
      - run: python tests/review_smoke.py target/debug/securecrt-mcp
      - run: python scripts/validate_repository.py
      - name: Commit reviewed and validated sources to feature branch only
        run: |
          test "$(git branch --show-current)" = feat/agent-first-command-ux
          rm .agent-ux-review.py .github/workflows/agent-ux-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src clients tests README* CHANGELOG.md docs .agent-ux-review.py .github/workflows/agent-ux-review.yml
          git commit -m 'fix: preserve execution evidence and drain short work on graceful disconnect'
          git push origin HEAD:refs/heads/feat/agent-first-command-ux
